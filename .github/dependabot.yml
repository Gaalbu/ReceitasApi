version: 2

updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.jsonwebtoken:*"
        versions: [">=0.13.0"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /receitasapi-ui
    schedule:
      interval: weekly
    groups:
      angular-major:
        patterns: ["@angular/*"]
        update-types: [major]
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
